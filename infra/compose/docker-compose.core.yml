services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: srh-postgres
    restart: unless-stopped
    profiles:
      - core
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:-debezium_pass}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - srh-network

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: srh-redis
    restart: unless-stopped
    profiles:
      - core
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - srh-network

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: srh-minio
    restart: unless-stopped
    profiles:
      - core
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - srh-network

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    container_name: srh-minio-init
    profiles:
      - core
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo '>>> Configuring MinIO client alias...';
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      echo '>>> Creating application buckets if they do not exist...';
      mc mb --ignore-existing local/handover-photos;
      mc mb --ignore-existing local/acts;
      mc mb --ignore-existing local/catalog-media;
      echo '>>> MinIO buckets initialized successfully:';
      mc ls local;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - srh-network

volumes:
  postgres_data:
    name: srh_postgres_data
  redis_data:
    name: srh_redis_data
  minio_data:
    name: srh_minio_data

networks:
  srh-network:
    name: srh-network
