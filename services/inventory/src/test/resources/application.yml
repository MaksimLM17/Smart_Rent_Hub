server:
  port: 0

spring:
  application:
    name: inventory-test

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

srh:
  security:
    enabled: true
    public-endpoints:
      - /actuator/**
      - /api/v1/catalog/**

logging:
  level:
    root: INFO
    team.ylab.inventory: DEBUG
