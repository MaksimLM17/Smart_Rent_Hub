server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    compatibility-verifier:
      enabled: false

  # Reactive Redis connection
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Spring Session via Redis
  session:
    store-type: redis
    redis:
      namespace: spring:session
    timeout: ${SRH_SESSION_TIMEOUT:28800s}

  # OAuth2 Client (BFF)
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTH_URI:http://localhost:8081/realms/smartrent/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/smartrent/protocol/openid-connect/token}
            jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8081/realms/smartrent/protocol/openid-connect/certs}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://localhost:8081/realms/smartrent/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username
        registration:
          customer:
            provider: keycloak
            client-id: srh-customer
            client-secret: ${SRH_CUSTOMER_CLIENT_SECRET:srh-customer-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/customer"
            scope:
              - openid
              - profile
              - email
              - roles
          staff:
            provider: keycloak
            client-id: srh-staff
            client-secret: ${SRH_STAFF_CLIENT_SECRET:srh-staff-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/staff"
            scope:
              - openid
              - profile
              - email
              - roles

srh:
  gateway:
    routes:
      inventory-uri: ${INVENTORY_SERVICE_URI:http://localhost:8082}
      customer-web-uri: ${CUSTOMER_WEB_URI:forward:/__stub/customer-web}
      staff-web-uri: ${STAFF_WEB_URI:forward:/__stub/staff-web}
    session:
      redis-enabled: ${SRH_REDIS_SESSION_ENABLED:true}
      timeout: ${SRH_SESSION_TIMEOUT:8h}
      staff-timeout: ${SRH_STAFF_SESSION_TIMEOUT:12h}
      cookie-name: SESSION
      cookie-secure: ${SRH_SESSION_COOKIE_SECURE:false}
      cookie-same-site: Lax
      cookie-path: /
    security:
      customer-login-redirect-uri: /
      staff-login-redirect-uri: /staff
      logout-success-uri: /
      csrf:
        enabled: ${SRH_CSRF_ENABLED:true}
        cookie-name: XSRF-TOKEN
        header-name: X-XSRF-TOKEN
        cookie-same-site: Lax
        cookie-path: /
        allowed-origins:
          - "http://localhost:3000"
          - "http://localhost:3001"
          - "http://127.0.0.1:3000"
          - "http://127.0.0.1:3001"
    rate-limit:
      enabled: ${SRH_RATE_LIMIT_ENABLED:true}
      replenish-rate: ${SRH_RATE_LIMIT_REPLENISH_RATE:50}
      burst-capacity: ${SRH_RATE_LIMIT_BURST_CAPACITY:100}
      requested-tokens: 1
      include-headers: true
      fail-open: true

smartrent:
  observability:
    service-name: gateway
    tracing:
      otlp:
        endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    team.ylab.gateway: INFO
